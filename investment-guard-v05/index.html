<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.svg"><title>투자 감시기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--bg:#f5f6f8;--card:#fff;--text:#15171c;--muted:#7c828c;--line:#e8eaee;--green:#15763a;--orange:#ba6118;--yellow:#9b6916;--red:#b63d35;--blue:#315efb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px;background:rgba(245,246,248,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:3px;max-width:370px}.refresh{border:0;border-radius:14px;background:#15171c;color:white;width:42px;height:42px;font-size:18px}main{padding:14px}.hero{background:linear-gradient(145deg,#15171c,#2a2d34);color:white;border-radius:24px;padding:20px;margin-bottom:14px}.hero small{color:#bfc4cd}.hero h1{font-size:28px;margin:6px 0}.notice{background:#fff8e7;border:1px solid #f0dba9;border-radius:16px;padding:12px 14px;margin:9px 0;font-size:12px;color:#6f501b}.section{font-size:15px;margin:20px 4px 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,25,35,.05)}.asset{width:100%;text-align:left;color:inherit}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ticker{font-size:19px;font-weight:850}.name{font-size:11px;color:var(--muted)}.price{text-align:right;font-size:18px;font-weight:800}.badge{display:inline-block;font-size:9px;font-weight:850;border-radius:999px;padding:4px 7px;margin-left:5px;vertical-align:2px}.us{background:#eaf0ff;color:#315efb}.kr{background:#fff0e5;color:#a85414}.status{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.reason{display:block;margin-top:6px;font-size:10px;color:var(--muted)}.green{background:#eaf7ee;color:var(--green)}.orange{background:#fff0e5;color:var(--orange)}.yellow{background:#fff7df;color:var(--yellow)}.red{background:#fdecea;color:var(--red)}.gray{background:#eff1f4;color:#606773}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.metric{background:#f8f9fb;border-radius:14px;padding:10px}.metric span{display:block;font-size:10px;color:var(--muted)}.metric b{display:block;font-size:14px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:white;color:#606773;border-radius:13px;padding:9px 13px;font-weight:800;white-space:nowrap}.tabs button.on{background:#15171c;color:white}.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.periods button{border:0;border-radius:11px;background:#f0f2f5;padding:8px 4px;font-weight:800;color:#666d78}.periods button.on{background:#15171c;color:white}.ext{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.ext div{background:#f8f9fb;border:1px solid #edf0f3;border-radius:14px;padding:10px}.ext span,.info span{font-size:10px;color:var(--muted)}.ext b{display:block;font-size:15px;margin-top:4px}.ext small{display:block;font-size:10px;color:var(--muted)}.legend{font-size:10px;color:var(--muted);display:flex;gap:10px;justify-content:flex-end}.legend i{display:inline-block;width:16px;margin-right:4px;vertical-align:middle}.p{border-top:3px solid #15171c}.m20{border-top:2px solid #315efb}.m60{border-top:1px dashed #d97706}.chart{height:305px;position:relative}.chart svg{width:100%;height:100%}.tooltip{display:none;position:absolute;top:8px;background:rgba(21,23,28,.94);color:#fff;padding:8px 10px;border-radius:10px;font-size:10px;z-index:2}.foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;align-items:center}.info{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.info:last-child{border-bottom:0}.full,.smallbtn{border:0;border-radius:14px;padding:12px 13px;background:#15171c;color:white;font-weight:800}.full{width:100%}.secondary{background:#eef0f4;color:#323842}.holding{display:flex;justify-content:space-between;align-items:center}.field{display:block;margin-bottom:10px}.field span{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe2e7;border-radius:13px;padding:11px 12px;background:white}.field textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;color:#8a9099;padding:8px;font-weight:800}.nav button.on{color:#15171c}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:10}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:26px 26px 0 0;padding:18px 16px 28px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:850}.close{border:0;width:32px;height:32px;border-radius:50%}.loading{position:fixed;inset:0;background:rgba(245,246,248,.75);display:grid;place-items:center;z-index:20}.loading>div{background:white;border-radius:16px;padding:14px 18px;font-weight:800}.aiBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.aiBtns button{border:1px solid var(--line);border-radius:13px;background:#f8f9fb;padding:10px;font-weight:800}.aiOut{background:#f7f8fb;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:12px;line-height:1.55;margin-top:10px}.warn{font-size:10px;color:#8a5c18;background:#fff8e7;border-radius:12px;padding:9px 10px;margin-top:8px}.source{font-size:9px;color:var(--muted);margin-top:6px}.inline{display:flex;gap:7px}.inline .field{flex:1}.inline button{align-self:flex-end;margin-bottom:10px}
</style></head><body><div id="app"></div>
<script>
const K='investment-guard-v05',OLD='investment-guard-v04',API='https://api.twelvedata.com';
const D={holdings:[{ticker:'QLD',name:'ProShares Ultra QQQ',market:'US',type:'index',shares:0,avgPrice:0,maxWeight:40,profitWatch:60,underlying:'QQQ',manualPrice:0}],cashKRW:0,fxUSDKRW:1400,apiKey:'',qldMaxWeight:40,minCashRatio:20,qldProfitWatch:60,qldStages:[-10,-15,-20,-30],market:{}};
let s=load(),page='home',sel=s.holdings[0]?.ticker||'',period='3M',busy=false,msg='',editor=null,chartPts=[],ai='';
function clone(x){return JSON.parse(JSON.stringify(x))}
function normH(h){let m=h.market||(/^\d{6}$/.test(String(h.ticker||''))?'KR':'US');return{ticker:String(h.ticker||'').trim().toUpperCase(),name:h.name||h.ticker||'',market:m,type:h.type||'stock',shares:+h.shares||0,avgPrice:+h.avgPrice||0,maxWeight:Number.isFinite(+h.maxWeight)?+h.maxWeight:25,profitWatch:Number.isFinite(+h.profitWatch)?+h.profitWatch:40,underlying:h.underlying,manualPrice:+h.manualPrice||0}}
function load(){try{let raw=localStorage.getItem(K)||localStorage.getItem(OLD)||'{}',x={...clone(D),...JSON.parse(raw)};x.holdings=(x.holdings||[]).map(normH);return x}catch{return clone(D)}}
function save(){localStorage.setItem(K,JSON.stringify(s))}
const pct=n=>Number.isFinite(+n)?((+n>0?'+':'')+(+n).toFixed(1)+'%'):'-',date=x=>x?String(x).replaceAll('-','.'):'-',won=n=>Number.isFinite(+n)?'₩'+Math.round(+n).toLocaleString():'-',usd=n=>Number.isFinite(+n)?'$'+(+n).toFixed(2):'-';
const key=h=>h.market==='KR'?'KR:'+h.ticker:h.ticker, mkt=h=>s.market[key(h)], fmt=(h,n)=>h?.market==='KR'?won(n):usd(n), fx=h=>h.market==='KR'?1:s.fxUSDKRW;
const mv=h=>(mkt(h)?.price||h.manualPrice||0)*h.shares*fx(h),total=()=>s.cashKRW+s.holdings.reduce((a,h)=>a+mv(h),0),weight=h=>total()?mv(h)/total()*100:0,ret=h=>{let p=mkt(h)?.price||h.manualPrice;return p&&h.avgPrice?(p/h.avgPrice-1)*100:null};
function ma(b,n){let m=new Map(),sum=0;b.forEach((x,i)=>{sum+=x.close;if(i>=n)sum-=b[i-n].close;if(i>=n-1)m.set(x.date,sum/n)});return m}
function periodBars(b){if(!b.length)return[];let end=new Date(b.at(-1).date+'T12:00:00Z'),st=new Date(end);if(period==='1M')st.setUTCMonth(st.getUTCMonth()-1);else if(period==='3M')st.setUTCMonth(st.getUTCMonth()-3);else if(period==='6M')st.setUTCMonth(st.getUTCMonth()-6);else st.setUTCFullYear(st.getUTCFullYear()-1);let z=st.toISOString().slice(0,10);return b.filter(x=>x.date>=z)}
function ex(b){if(!b.length)return null;let hi={value:-1,date:''},lo={value:1e99,date:''};b.forEach(x=>{if(x.high>hi.value)hi={value:x.high,date:x.date};if(x.low<lo.value)lo={value:x.low,date:x.date}});return{hi,lo}}
function dd52(){let q=s.market.QQQ;if(!q?.bars?.length)return null;let a=q.bars.slice(-252),hi=Math.max(...a.map(x=>x.high)),p=q.price||a.at(-1).close;return(p/hi-1)*100}
function cashRatio(){return total()?s.cashKRW/total()*100:0}
function sig(h){let mm=mkt(h),has=!!(mm?.price||h.manualPrice);if(!has)return['시세 필요','gray',1,'시세를 먼저 갱신하거나 수동 현재가를 입력하세요'];let w=weight(h),r=ret(h);if(h.ticker==='QLD'&&h.market==='US'){let d=dd52(),st=0;s.qldStages.forEach((x,i)=>{if(d!==null&&d<=x)st=i+1});if(w>=s.qldMaxWeight)return['추가매수 제한','red',3,'QLD '+w.toFixed(1)+'% ≥ 최대 '+s.qldMaxWeight+'%'];if(total()&&cashRatio()<=s.minCashRatio)return['추가매수 제한','red',3,'현금 '+cashRatio().toFixed(1)+'% ≤ 최소 '+s.minCashRatio+'%'];if(r!==null&&r>=s.qldProfitWatch)return['익절 감시','yellow',2,'수익률 '+pct(r)+' ≥ 기준 +'+s.qldProfitWatch+'%'];if(st)return['추가매수 '+st+'단계','orange',2,'QQQ 52주 고점 대비 '+pct(d)+' → '+st+'단계'];return['정기 적립','green',0,d===null?'QQQ 데이터 확인 필요':'QQQ 52주 고점 대비 '+pct(d)]}if(w>=h.maxWeight)return['비중 확인','red',3,'현재 '+w.toFixed(1)+'% ≥ 최대 '+h.maxWeight+'%'];if(r!==null&&r>=h.profitWatch)return['익절 감시','yellow',2,'수익률 '+pct(r)+' ≥ 기준 +'+h.profitWatch+'%'];return['보유','green',0,'현재 비중 '+w.toFixed(1)+'% · 수익률 '+pct(r)]}
function url(p,o){let u=new URL(API+p);Object.entries(o||{}).forEach(([k,v])=>v!==undefined&&v!==''&&u.searchParams.set(k,v));u.searchParams.set('apikey',s.apiKey);return u}
async function j(p,o){let r=await fetch(url(p,o)),d=await r.json();if(!r.ok||d.status==='error'||d.code)throw Error(d.message||'API 오류');return d}
const bars=v=>(v||[]).map(x=>({date:String(x.datetime||'').slice(0,10),open:+x.open,high:+x.high,low:+x.low,close:+x.close})).filter(x=>x.date&&Number.isFinite(x.close)).sort((a,b)=>a.date.localeCompare(b.date));
async function historyUS(t,end,n=400){let d=await j('/time_series',{symbol:t,interval:'1day',outputsize:n,order:'DESC',adjust:'splits',end_date:end});return bars(d.values)}
function num(x){if(typeof x==='number')return x;return +(String(x??'').replaceAll(',',''))}
async function krBasic(code){let r=await fetch('/api/kr?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'한국 시세 오류');return{name:d.name||'',price:+d.price,change:+d.changePct||0,market:d.market||'',time:d.time||''}}
function findPriceArray(obj){if(!obj||typeof obj!=='object')return null;if(Array.isArray(obj)&&obj.length&&obj.some(x=>x&&typeof x==='object'&&('localDate'in x)&&('closePrice'in x)))return obj;if(Array.isArray(obj)){for(let x of obj){let z=findPriceArray(x);if(z)return z}}else{for(let v of Object.values(obj)){let z=findPriceArray(v);if(z)return z}}return null}
async function krHistory(code){let r=await fetch('/api/kr?code='+encodeURIComponent(code)+'&chart=1',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'한국 차트 오류');let out=d.bars||[];if(!out.length)throw Error('한국 차트 데이터 없음');return out}
async function refresh(){busy=true;msg='시세를 불러오는 중…';render();let errs=[];for(let h of s.holdings){try{if(h.market==='KR'){let d=await krBasic(h.ticker);s.market[key(h)]={...(s.market[key(h)]||{}),price:d.price,change:d.change,fetchedAt:new Date().toISOString(),source:'NAVER'};if((!h.name||h.name===h.ticker)&&d.name)h.name=d.name}else{if(!s.apiKey)throw Error('Twelve Data 키 없음');let d=await j('/price',{symbol:h.ticker});s.market[key(h)]={...(s.market[key(h)]||{}),price:+d.price,fetchedAt:new Date().toISOString(),source:'TWELVE'}}}catch(e){if(h.market==='KR'&&h.manualPrice>0)s.market[key(h)]={...(s.market[key(h)]||{}),price:h.manualPrice,source:'MANUAL',fetchedAt:new Date().toISOString()};else errs.push(h.ticker+': '+e.message)}}if(s.holdings.some(h=>h.ticker==='QLD'&&h.market==='US')&&s.apiKey){try{let b=await historyUS('QQQ',undefined,400);s.market.QQQ={price:b.at(-1).close,bars:b,fetchedAt:new Date().toISOString(),source:'TWELVE'}}catch(e){errs.push('QQQ: '+e.message)}}if(s.apiKey){try{s.fxUSDKRW=+(await j('/exchange_rate',{symbol:'USD/KRW'})).rate}catch{}}save();busy=false;msg=errs.length?'부분 완료 · '+errs.slice(0,2).join(' / ')+(errs.length>2?' 외 '+(errs.length-2)+'건':''):'업데이트 완료';render()}
async function ensure(t,full=false){let h=s.holdings.find(x=>x.ticker===t);if(!h)return;let kk=key(h);if(!full&&s.market[kk]?.bars?.length>=60)return;busy=true;msg=t+' 차트 로딩 중…';render();try{let b;if(h.market==='KR'){b=await krHistory(h.ticker);s.market[kk]={...(s.market[kk]||{}),price:s.market[kk]?.price||b.at(-1).close,bars:b,historyComplete:false,source:s.market[kk]?.source||'NAVER'}}else{if(!s.apiKey)throw Error('Twelve Data API Key를 먼저 입력해주세요.');b=s.market[kk]?.bars;if(!b?.length)b=await historyUS(t,undefined,400);s.market[kk]={...(s.market[kk]||{}),price:s.market[kk]?.price||b.at(-1).close,bars:b};if(full){let end,hi={value:-1,date:''},lo={value:1e99,date:''},complete=false;for(let p=0;p<4;p++){let c=await historyUS(t,end,5000);c.forEach(x=>{if(x.high>hi.value)hi={value:x.high,date:x.date};if(x.low<lo.value)lo={value:x.low,date:x.date}});if(c.length<5000){complete=true;break}let d=new Date(c[0].date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);end=d.toISOString().slice(0,10)}Object.assign(s.market[kk],{allTimeHigh:hi,allTimeLow:lo,historyComplete:complete})}}save();msg='완료'}catch(e){msg=h.market==='KR'?'한국 무료 차트 조회 실패 · 수동 현재가는 사용 가능 ('+e.message+')':e.message}busy=false;render()}
function chart(b,h){let pb=periodBars(b),m20=ma(b,20),m60=ma(b,60);if(!pb.length)return'<div class="name">차트 데이터 없음</div>';let r=pb.map(x=>({...x,ma20:m20.get(x.date),ma60:m60.get(x.date)})),v=[];r.forEach(x=>{v.push(x.close);if(x.ma20)v.push(x.ma20);if(x.ma60)v.push(x.ma60)});let mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;mn-=rg*.06;mx+=rg*.06;let W=440,H=300,L=44,R=10,T=12,B=34,pw=W-L-R,ph=H-T-B,pt=(z,i)=>[L+i*pw/Math.max(1,r.length-1),T+(mx-z)*ph/(mx-mn)],path=k=>{let d='',on=false;r.forEach((x,i)=>{let z=x[k];if(!Number.isFinite(z)){on=false;return}let[a,b]=pt(z,i);d+=(on?' L ':'M ')+a+' '+b;on=true});return d},cp=path('close'),p20=path('ma20'),p60=path('ma60'),n=period==='1M'?6:period==='3M'?7:period==='6M'?8:9,ii=[];for(let k=0;k<n;k++)ii.push(Math.round(k*(r.length-1)/(n-1)));let ticks=[...new Set(ii)].map((i,k,a)=>{let[x]=pt(r[i].close,i),an=k===0?'start':k===a.length-1?'end':'middle';return'<text x="'+x+'" y="292" text-anchor="'+an+'" font-size="9" fill="#858b95">'+r[i].date.slice(5).replace('-','/')+'</text>'}).join('');chartPts=r;return'<svg viewBox="0 0 440 300" preserveAspectRatio="none"><path d="'+p60+'" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 5"/><path d="'+p20+'" fill="none" stroke="#315efb" stroke-width="2"/><path d="'+cp+'" fill="none" stroke="#15171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+ticks+'</svg>'}
function metric(a,b){return'<div class="metric"><span>'+a+'</span><b>'+b+'</b></div>'}function ext(a,x,h){return'<div><span>'+a+'</span><b>'+fmt(h,x?.value)+'</b><small>'+date(x?.date)+'</small></div>'}function badge(h){return'<span class="badge '+(h.market==='KR'?'kr':'us')+'">'+(h.market==='KR'?'한국':'미국')+'</span>'}
function home(){let ss=s.holdings.map(h=>[h,sig(h)]),issues=ss.filter(x=>x[1][2]>=2),cards=s.holdings.map(h=>{let q=sig(h),d=h.ticker==='QLD'&&h.market==='US'?dd52():null,p=mkt(h)?.price||h.manualPrice;return'<button class="card asset" data-detail="'+h.ticker+'"><div class="row"><div><div class="ticker">'+h.ticker+badge(h)+'</div><div class="name">'+h.name+'</div></div><div class="price">'+fmt(h,p)+'</div></div><div class="status '+q[1]+'">'+q[0]+'</div><span class="reason">'+q[3]+'</span><div class="metrics">'+metric('내 수익률',pct(ret(h)))+metric(h.ticker==='QLD'&&h.market==='US'?'QQQ 52주 고점 대비':'보유 비중',h.ticker==='QLD'&&h.market==='US'?pct(d):weight(h).toFixed(1)+'%')+metric('평가액',won(mv(h)))+'</div></button>'}).join('');return'<div class="hero"><small>오늘의 상태</small><h1>'+(issues.length?'확인할 항목 '+issues.length+'개':'확인할 항목 없음')+'</h1><div>총자산 '+won(total())+'</div></div>'+issues.map(x=>'<div class="notice"><b>'+x[0].ticker+' · '+x[1][0]+'</b><br>'+x[1][3]+'</div>').join('')+'<h2 class="section">내 자산</h2>'+cards}
function detail(){let h=s.holdings.find(x=>x.ticker===sel)||s.holdings[0];if(!h)return'<div class="card">종목 없음</div>';let sn=mkt(h),b=sn?.bars||[],e=ex(periodBars(b)),f=ex(b),allH=sn?.allTimeHigh||f?.hi,allL=sn?.allTimeLow||f?.lo,q=sig(h),src=sn?.source==='NAVER'?'네이버 금융(무료·비공식)':sn?.source==='MANUAL'?'수동 입력':'Twelve Data';return'<h2 class="section">종목 상세</h2><div class="tabs">'+s.holdings.map(x=>'<button data-t="'+x.ticker+'" class="'+(x.ticker===h.ticker?'on':'')+'">'+x.ticker+'</button>').join('')+'</div><div class="card"><div class="row"><div><div class="ticker">'+h.ticker+badge(h)+'</div><div class="name">'+h.name+'</div></div><div class="price">'+fmt(h,sn?.price||h.manualPrice)+'</div></div><div class="status '+q[1]+'">'+q[0]+'</div><span class="reason">'+q[3]+'</span><div class="metrics">'+metric('내 수익률',pct(ret(h)))+metric('보유 수량',h.shares+'주')+metric('보유 비중',weight(h).toFixed(1)+'%')+'</div><div class="source">시세: '+src+'</div></div><div class="card"><div class="row"><b>가격 추이</b><div class="legend"><span><i class="p"></i>가격</span><span><i class="m20"></i>20일선</span><span><i class="m60"></i>60일선</span></div></div><div class="periods">'+['1M','3M','6M','1Y'].map(x=>'<button data-p="'+x+'" class="'+(period===x?'on':'')+'">'+({'1M':'1개월','3M':'3개월','6M':'6개월','1Y':'1년'})[x]+'</button>').join('')+'</div><div class="ext">'+ext('기간 최고',e?.hi,h)+ext('기간 최저',e?.lo,h)+ext(h.market==='US'&&sn?.historyComplete?'전체 최고':'조회 최고*',allH,h)+ext(h.market==='US'&&sn?.historyComplete?'전체 최저':'조회 최저*',allL,h)+'</div><div class="chart" id="chart">'+chart(b,h)+'<div class="tooltip" id="tip"></div></div><div class="foot"><span>'+(h.market==='KR'?'* 무료 한국 차트 조회 범위 기준':'* 전체 이력은 별도 호출')+'</span>'+(h.market==='US'&&!sn?.historyComplete&&s.apiKey?'<button class="smallbtn secondary" data-full="1">전체 이력</button>':'')+'</div></div><div class="card">'+['평균매수가|'+fmt(h,h.avgPrice),'평가액|'+won(mv(h)),'보유비중|'+weight(h).toFixed(1)+'%'].map(x=>{let[a,b]=x.split('|');return'<div class="info"><span>'+a+'</span><b>'+b+'</b></div>'}).join('')+'</div>'+aiCard(h)+'<button class="full secondary" data-edit="'+h.ticker+'">보유정보 수정</button>'}
function fld(l,k,v,t='text'){return'<label class="field"><span>'+l+'</span><input data-s="'+k+'" type="'+t+'" value="'+escAttr(v)+'"></label>'}
function aiCard(h){return'<div class="card"><b>AI 숫자 점검</b><div class="name" style="margin-top:5px">현재 앱의 보유비중·수익률·시그널만 보고 체크포인트를 정리합니다.</div><div class="aiBtns"><button data-ai="추가매수 전 점검">추가매수 전 점검</button><button data-ai="매도 전 점검">매도 전 점검</button><button data-ai="보유 상태 점검">보유 상태 점검</button><button data-ai="오늘 확인할 항목">오늘 확인할 항목</button></div>'+(ai?'<div class="aiOut">'+esc(ai)+'</div>':'')+'<div class="warn">AI는 주문을 실행하지 않으며 매수·매도를 확정적으로 지시하지 않습니다. 뉴스·실적·세금은 자동 반영되지 않습니다.</div></div>'}
async function askAI(question){let h=s.holdings.find(x=>x.ticker===sel)||s.holdings[0];if(!h)return;busy=true;msg='AI 점검 중…';render();try{let context={ticker:h.ticker,name:h.name,market:h.market,price:mkt(h)?.price||h.manualPrice||null,shares:h.shares,avgPrice:h.avgPrice,returnPct:ret(h),weightPct:weight(h),marketValueKRW:mv(h),cashKRW:s.cashKRW,cashRatioPct:cashRatio(),signal:sig(h)[0],signalReason:sig(h)[3],qqqDrawdown52wPct:(h.ticker==='QLD'&&h.market==='US')?dd52():null};let r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,context})}),d=await r.json();if(!r.ok)throw Error(d.error||'AI 서버 오류');ai=d.answer||'응답 없음';msg='AI 점검 완료'}catch(e){ai='오류: '+e.message;msg='AI 사용 불가'}busy=false;render()}

function settings(){return'<h2 class="section">내 종목</h2>'+s.holdings.map(h=>'<div class="card holding"><div><b>'+h.ticker+badge(h)+'</b><div class="name">'+h.shares+'주 · 평단 '+fmt(h,h.avgPrice)+'</div></div><button class="smallbtn secondary" data-edit="'+h.ticker+'">수정</button></div>').join('')+'<button class="full" data-add="1">＋ 종목 추가</button><h2 class="section">내 자산</h2><div class="card">'+fld('현금 보유액 (원)','cashKRW',s.cashKRW,'number')+fld('원/달러 환율','fxUSDKRW',s.fxUSDKRW,'number')+'</div><h2 class="section">QLD 규칙</h2><div class="card grid">'+fld('최대 비중 (%)','qldMaxWeight',s.qldMaxWeight,'number')+fld('최소 현금 비중 (%)','minCashRatio',s.minCashRatio,'number')+fld('익절 감시 (%)','qldProfitWatch',s.qldProfitWatch,'number')+s.qldStages.map((x,i)=>fld((i+1)+'단계 하락률 (%)','st'+i,x,'number')).join('')+'</div><h2 class="section">미국 시세 API</h2><div class="card">'+fld('Twelve Data API Key','apiKey',s.apiKey,'password')+'<div class="name">미국 종목/QQQ/환율 조회용. 이 기기 브라우저에 저장됩니다.</div></div><h2 class="section">한국 시세</h2><div class="card"><b>무료 우선</b><div class="name" style="margin-top:6px">Vercel 프록시를 통해 네이버 금융 공개 엔드포인트를 사용합니다. 비공식 데이터라 서비스 변경 시 실패할 수 있으며, 그때는 수동 현재가를 사용할 수 있습니다.</div></div><h2 class="section">OpenAI</h2><div class="card"><b>서버에서만 키 사용</b><div class="name" style="margin-top:6px">OpenAI API Key는 앱/브라우저에 저장하지 않고 Vercel 환경변수 OPENAI_API_KEY에만 둡니다.</div></div>'}
function editHtml(){if(!editor)return'';let h=editor.v,E=!!editor.old;return'<div class="modal"><div class="sheet"><div class="sheethead"><span>'+(E?h.ticker+' 수정':'종목 추가')+'</span><button class="close" data-close="1">×</button></div><label class="field"><span>시장</span><select data-s="eMarket"><option value="US" '+(h.market==='US'?'selected':'')+'>미국 (USD)</option><option value="KR" '+(h.market==='KR'?'selected':'')+'>한국 (KRW)</option></select></label><div class="grid">'+fld(h.market==='KR'?'종목코드 (6자리)':'티커','eTicker',h.ticker)+fld('보유주수','eShares',h.shares,'number')+fld(h.market==='KR'?'평균매수가 (원)':'평균매수가 ($)','eAvg',h.avgPrice,'number')+fld('표시 이름','eName',h.name)+fld('최대 비중 (%)','eMax',h.maxWeight,'number')+fld('익절 감시 (%)','eProfit',h.profitWatch,'number')+fld('수동 현재가 (한국만, 선택)','eManual',h.manualPrice||0,'number')+'</div><button class="full" data-save="1">저장</button>'+(E?'<button class="full secondary" data-del="1" style="margin-top:8px">삭제</button>':'')+'</div></div>'}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function escAttr(x){return esc(x).replaceAll('"','&quot;')}
function render(){document.getElementById('app').innerHTML='<div class="app"><header class="top"><div><div class="brand">투자 감시기</div><div class="sub">'+esc(msg||'v0.5 · 미국 + 한국 + AI')+'</div></div><button class="refresh" data-refresh="1">↻</button></header><main>'+(page==='home'?home():page==='detail'?detail():settings())+'</main><nav class="nav">'+['home','detail','settings'].map(x=>'<button data-nav="'+x+'" class="'+(page===x?'on':'')+'">'+({home:'⌂ 홈',detail:'⌁ 상세',settings:'⚙ 설정'})[x]+'</button>').join('')+'</nav></div>'+editHtml()+(busy?'<div class="loading"><div>'+esc(msg)+'</div></div>':'');bind()}
function bind(){document.querySelector('[data-refresh]')?.addEventListener('click',refresh);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();if(page==='detail'&&sel)ensure(sel)});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{sel=b.dataset.detail;page='detail';render();ensure(sel)});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=b.dataset.t;render();ensure(sel)});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;render()});document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>askAI(b.dataset.ai));document.querySelector('[data-full]')?.addEventListener('click',()=>ensure(sel,true));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelector('[data-add]')?.addEventListener('click',()=>openEdit());document.querySelector('[data-close]')?.addEventListener('click',()=>{editor=null;render()});document.querySelector('[data-save]')?.addEventListener('click',saveEdit);document.querySelector('[data-del]')?.addEventListener('click',delEdit);document.querySelectorAll('[data-s]').forEach(x=>x.onchange=change);let c=document.getElementById('chart'),tip=document.getElementById('tip'),h=s.holdings.find(x=>x.ticker===sel);if(c&&tip&&chartPts.length&&h)c.onpointermove=e=>{let r=c.getBoundingClientRect(),i=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(chartPts.length-1)),p=chartPts[i];tip.style.display='block';tip.style.left=Math.min(r.width-130,Math.max(5,e.clientX-r.left+8))+'px';tip.innerHTML=date(p.date)+'<br>종가 '+fmt(h,p.close)+'<br>20일선 '+fmt(h,p.ma20)+'<br>60일선 '+fmt(h,p.ma60)}}
function openEdit(t){let f=s.holdings.find(h=>h.ticker===t);editor={old:f?.ticker||null,v:f?clone(f):{ticker:'',name:'',market:'US',type:'stock',shares:0,avgPrice:0,maxWeight:25,profitWatch:40,manualPrice:0}};render()}
function change(e){let k=e.target.dataset.s,v=e.target.value;if(k?.startsWith('e')){let h=editor.v;if(k==='eMarket')h.market=v;if(k==='eTicker')h.ticker=v.toUpperCase();if(k==='eShares')h.shares=+v||0;if(k==='eAvg')h.avgPrice=+v||0;if(k==='eName')h.name=v;if(k==='eMax')h.maxWeight=+v||0;if(k==='eProfit')h.profitWatch=+v||0;if(k==='eManual')h.manualPrice=+v||0;render();return}if(k==='apiKey')s.apiKey=v;else if(k.startsWith('st'))s.qldStages[+k.slice(2)]=+v||0;else s[k]=+v||0;save();msg='✓ 저장됨';render()}
function saveEdit(){let h=normH(editor.v);if(h.market==='KR'){h.ticker=h.ticker.replace(/\D/g,'').slice(0,6);if(h.ticker.length!==6){msg='한국 종목코드는 6자리 숫자로 입력해주세요.';render();return}}if(!h.ticker)return;let i=s.holdings.findIndex(x=>x.ticker===editor.old);if(i>=0)s.holdings[i]=h;else s.holdings.push(h);if(h.market==='KR'&&h.manualPrice>0)s.market[key(h)]={...(s.market[key(h)]||{}),price:h.manualPrice,source:'MANUAL',fetchedAt:new Date().toISOString()};sel=h.ticker;editor=null;save();msg='✓ 종목 저장됨';render()}
function delEdit(){s.holdings=s.holdings.filter(h=>h.ticker!==editor.old);sel=s.holdings[0]?.ticker||'';editor=null;save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=5',{updateViaCache:'none'}).catch(()=>{});save();render();
</script></body></html>
