<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.svg"><title>투자 감시기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;--bg:#f5f6f8;--card:#fff;--text:#15171c;--muted:#7c828c;--line:#e8eaee;--green:#15763a;--orange:#ba6118;--yellow:#9b6916;--red:#b63d35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px;background:rgba(245,246,248,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:3px}.refresh{border:0;border-radius:14px;background:#15171c;color:white;width:42px;height:42px;font-size:18px}main{padding:14px}.hero{background:linear-gradient(145deg,#15171c,#2a2d34);color:white;border-radius:24px;padding:20px;margin-bottom:14px}.hero small{color:#bfc4cd}.hero h1{font-size:28px;margin:6px 0}.notice{background:#fff8e7;border:1px solid #f0dba9;border-radius:16px;padding:12px 14px;margin:9px 0;font-size:12px;color:#6f501b}.section{font-size:15px;margin:20px 4px 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,25,35,.05)}.asset{width:100%;text-align:left;color:inherit}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ticker{font-size:19px;font-weight:850}.name{font-size:11px;color:var(--muted)}.price{text-align:right;font-size:18px;font-weight:800}.status{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.green{background:#eaf7ee;color:var(--green)}.orange{background:#fff0e5;color:var(--orange)}.yellow{background:#fff7df;color:var(--yellow)}.red{background:#fdecea;color:var(--red)}.gray{background:#eff1f4;color:#606773}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.metric{background:#f8f9fb;border-radius:14px;padding:10px}.metric span{display:block;font-size:10px;color:var(--muted)}.metric b{display:block;font-size:14px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:white;color:#606773;border-radius:13px;padding:9px 13px;font-weight:800;white-space:nowrap}.tabs button.on{background:#15171c;color:white}.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.periods button{border:0;border-radius:11px;background:#f0f2f5;padding:8px 4px;font-weight:800;color:#666d78}.periods button.on{background:#15171c;color:white}.ext{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.ext div{background:#f8f9fb;border:1px solid #edf0f3;border-radius:14px;padding:10px}.ext span,.info span{font-size:10px;color:var(--muted)}.ext b{display:block;font-size:15px;margin-top:4px}.ext small{display:block;font-size:10px;color:var(--muted)}.legend{font-size:10px;color:var(--muted);display:flex;gap:10px;justify-content:flex-end}.legend i{display:inline-block;width:16px;margin-right:4px;vertical-align:middle}.p{border-top:3px solid #15171c}.m20{border-top:2px solid #315efb}.m60{border-top:1px dashed #d97706}.chart{height:305px;position:relative}.chart svg{width:100%;height:100%}.tooltip{display:none;position:absolute;top:8px;background:rgba(21,23,28,.94);color:#fff;padding:8px 10px;border-radius:10px;font-size:10px}.foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.info{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.info:last-child{border-bottom:0}.full,.smallbtn{border:0;border-radius:14px;padding:12px 13px;background:#15171c;color:white;font-weight:800}.full{width:100%}.secondary{background:#eef0f4;color:#323842}.holding{display:flex;justify-content:space-between;align-items:center}.field{display:block;margin-bottom:10px}.field span{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px}.field input,.field select{width:100%;border:1px solid #dfe2e7;border-radius:13px;padding:11px 12px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;color:#8a9099;padding:8px;font-weight:800}.nav button.on{color:#15171c}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:10}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:26px 26px 0 0;padding:18px 16px 28px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:850}.close{border:0;width:32px;height:32px;border-radius:50%}.loading{position:fixed;inset:0;background:rgba(245,246,248,.75);display:grid;place-items:center;z-index:20}.loading>div{background:white;border-radius:16px;padding:14px 18px;font-weight:800}
</style></head><body><div id="app"></div>
<script>
const K='investment-guard-v04',API='https://api.twelvedata.com';
const D={holdings:[{ticker:'QLD',name:'ProShares Ultra QQQ',type:'index',shares:0,avgPrice:0,maxWeight:40,profitWatch:60,underlying:'QQQ'}],cashKRW:0,fxUSDKRW:1400,apiKey:'',qldMaxWeight:40,minCashRatio:20,qldProfitWatch:60,qldStages:[-10,-15,-20,-30],market:{}};
let s=load(),page='home',sel=s.holdings[0]?.ticker||'',period='3M',busy=false,msg='',editor=null,chartPts=[];
function load(){try{return {...structuredClone(D),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return structuredClone(D)}}function save(){localStorage.setItem(K,JSON.stringify(s))}
const usd=n=>Number.isFinite(+n)?'$'+(+n).toFixed(2):'-', pct=n=>Number.isFinite(+n)?((+n>0?'+':'')+(+n).toFixed(1)+'%'):'-', date=x=>x?x.replaceAll('-','.'):'-';
const mv=h=>(s.market[h.ticker]?.price||0)*h.shares*s.fxUSDKRW,total=()=>s.cashKRW+s.holdings.reduce((a,h)=>a+mv(h),0),weight=h=>total()?mv(h)/total()*100:0,ret=h=>s.market[h.ticker]?.price&&h.avgPrice?(s.market[h.ticker].price/h.avgPrice-1)*100:null;
function ma(b,n){let m=new Map(),sum=0;b.forEach((x,i)=>{sum+=x.close;if(i>=n)sum-=b[i-n].close;if(i>=n-1)m.set(x.date,sum/n)});return m}
function periodBars(b){if(!b.length)return[];let end=new Date(b.at(-1).date+'T12:00:00Z'),st=new Date(end);if(period==='1M')st.setUTCMonth(st.getUTCMonth()-1);else if(period==='3M')st.setUTCMonth(st.getUTCMonth()-3);else if(period==='6M')st.setUTCMonth(st.getUTCMonth()-6);else st.setUTCFullYear(st.getUTCFullYear()-1);let z=st.toISOString().slice(0,10);return b.filter(x=>x.date>=z)}
function ex(b){if(!b.length)return null;let hi={value:-1,date:''},lo={value:1e99,date:''};b.forEach(x=>{if(x.high>hi.value)hi={value:x.high,date:x.date};if(x.low<lo.value)lo={value:x.low,date:x.date}});return{hi,lo}}
function dd52(){let q=s.market.QQQ;if(!q?.bars?.length)return null;let a=q.bars.slice(-252),hi=Math.max(...a.map(x=>x.high)),p=q.price||a.at(-1).close;return(p/hi-1)*100}
function sig(h){if(!s.market[h.ticker])return['시세 필요','gray',1];let w=weight(h),r=ret(h);if(h.ticker==='QLD'){let d=dd52(),st=0;s.qldStages.forEach((x,i)=>{if(d!==null&&d<=x)st=i+1});if(w>=s.qldMaxWeight)return['추가매수 제한','red',3];if(total()&&s.cashKRW/total()*100<=s.minCashRatio)return['추가매수 제한','red',3];if(r!==null&&r>=s.qldProfitWatch)return['익절 감시','yellow',2];if(st)return['추가매수 '+st+'단계','orange',2];return['정기 적립','green',0]}if(w>=h.maxWeight)return['비중 확인','red',3];if(r!==null&&r>=h.profitWatch)return['익절 감시','yellow',2];return['보유','green',0]}
function url(p,o){let u=new URL(API+p);Object.entries(o||{}).forEach(([k,v])=>v!==undefined&&v!==''&&u.searchParams.set(k,v));u.searchParams.set('apikey',s.apiKey);return u}
async function j(p,o){let r=await fetch(url(p,o)),d=await r.json();if(!r.ok||d.status==='error'||d.code)throw Error(d.message||'API 오류');return d}
const bars=v=>(v||[]).map(x=>({date:x.datetime.slice(0,10),open:+x.open,high:+x.high,low:+x.low,close:+x.close})).sort((a,b)=>a.date.localeCompare(b.date));
async function history(t,end,n=400){let d=await j('/time_series',{symbol:t,interval:'1day',outputsize:n,order:'DESC',adjust:'splits',end_date:end});return bars(d.values)}
async function refresh(){if(!s.apiKey){page='settings';msg='설정에서 Twelve Data API Key를 먼저 입력해주세요.';return render()}busy=true;msg='실제 시세를 불러오는 중…';render();try{for(let h of s.holdings){let d=await j('/price',{symbol:h.ticker});s.market[h.ticker]={...(s.market[h.ticker]||{}),price:+d.price,fetchedAt:new Date().toISOString()}}if(s.holdings.some(h=>h.ticker==='QLD')){let b=await history('QQQ',undefined,400);s.market.QQQ={price:b.at(-1).close,bars:b,fetchedAt:new Date().toISOString()}}try{s.fxUSDKRW=+(await j('/exchange_rate',{symbol:'USD/KRW'})).rate}catch{}save();msg='업데이트 완료'}catch(e){msg=e.message}busy=false;render()}
async function ensure(t,full=false){if(!s.apiKey){msg='API Key를 먼저 입력해주세요.';return render()}if(!full&&s.market[t]?.bars?.length>=250)return;busy=true;msg=full?t+' 전체 이력 확인 중…':t+' 차트 로딩 중…';render();try{let b=s.market[t]?.bars;if(!b?.length){b=await history(t,undefined,400);s.market[t]={...(s.market[t]||{}),price:s.market[t]?.price||b.at(-1).close,bars:b}}if(full){let end,hi={value:-1,date:''},lo={value:1e99,date:''},complete=false;for(let p=0;p<4;p++){let c=await history(t,end,5000);c.forEach(x=>{if(x.high>hi.value)hi={value:x.high,date:x.date};if(x.low<lo.value)lo={value:x.low,date:x.date}});if(c.length<5000){complete=true;break}let d=new Date(c[0].date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);end=d.toISOString().slice(0,10)}Object.assign(s.market[t],{allTimeHigh:hi,allTimeLow:lo,historyComplete:complete})}save();msg='완료'}catch(e){msg=e.message}busy=false;render()}
function chart(b){let pb=periodBars(b),m20=ma(b,20),m60=ma(b,60);if(!pb.length)return'<div class="name">차트 데이터 없음</div>';let r=pb.map(x=>({...x,ma20:m20.get(x.date),ma60:m60.get(x.date)})),v=[];r.forEach(x=>{v.push(x.close);if(x.ma20)v.push(x.ma20);if(x.ma60)v.push(x.ma60)});let mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;mn-=rg*.06;mx+=rg*.06;let W=440,H=300,L=44,R=10,T=12,B=34,pw=W-L-R,ph=H-T-B,pt=(z,i)=>[L+i*pw/Math.max(1,r.length-1),T+(mx-z)*ph/(mx-mn)],path=k=>{let d='',on=false;r.forEach((x,i)=>{let z=x[k];if(!Number.isFinite(z)){on=false;return}let[a,b]=pt(z,i);d+=(on?' L ':'M ')+a+' '+b;on=true});return d},cp=path('close'),p20=path('ma20'),p60=path('ma60'),n=period==='1M'?6:period==='3M'?7:period==='6M'?8:9,ii=[];for(let k=0;k<n;k++)ii.push(Math.round(k*(r.length-1)/(n-1)));let ticks=[...new Set(ii)].map((i,k,a)=>{let[x]=pt(r[i].close,i),an=k===0?'start':k===a.length-1?'end':'middle';return '<text x="'+x+'" y="292" text-anchor="'+an+'" font-size="9" fill="#858b95">'+r[i].date.slice(5).replace('-','/')+'</text>'}).join('');chartPts=r;return '<svg viewBox="0 0 440 300" preserveAspectRatio="none"><path d="'+p60+'" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 5"/><path d="'+p20+'" fill="none" stroke="#315efb" stroke-width="2"/><path d="'+cp+'" fill="none" stroke="#15171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+ticks+'</svg>'}
function metric(a,b){return'<div class="metric"><span>'+a+'</span><b>'+b+'</b></div>'}function ext(a,x){return'<div><span>'+a+'</span><b>'+usd(x?.value)+'</b><small>'+date(x?.date)+'</small></div>'}
function home(){let ss=s.holdings.map(h=>[h,sig(h)]),issues=ss.filter(x=>x[1][2]>=2),cards=s.holdings.map(h=>{let q=sig(h),d=h.ticker==='QLD'?dd52():null;return'<button class="card asset" data-detail="'+h.ticker+'"><div class="row"><div><div class="ticker">'+h.ticker+'</div><div class="name">'+h.name+'</div></div><div class="price">'+usd(s.market[h.ticker]?.price)+'</div></div><div class="status '+q[1]+'">'+q[0]+'</div><div class="metrics">'+metric('내 수익률',pct(ret(h)))+metric(h.ticker==='QLD'?'QQQ 52주 고점 대비':'보유 비중',h.ticker==='QLD'?pct(d):weight(h).toFixed(1)+'%')+metric('보유 비중',weight(h).toFixed(1)+'%')+'</div></button>'}).join('');return'<div class="hero"><small>오늘의 상태</small><h1>'+(issues.length?'확인할 항목 '+issues.length+'개':'확인할 항목 없음')+'</h1><div>총자산 ₩'+Math.round(total()).toLocaleString()+'</div></div>'+issues.map(x=>'<div class="notice"><b>'+x[0].ticker+' · '+x[1][0]+'</b></div>').join('')+'<h2 class="section">내 자산</h2>'+cards}
function detail(){let h=s.holdings.find(x=>x.ticker===sel)||s.holdings[0];if(!h)return'<div class="card">종목 없음</div>';let sn=s.market[h.ticker],b=sn?.bars||[],e=ex(periodBars(b)),f=ex(b),allH=sn?.allTimeHigh||f?.hi,allL=sn?.allTimeLow||f?.lo,q=sig(h);return'<h2 class="section">종목 상세</h2><div class="tabs">'+s.holdings.map(x=>'<button data-t="'+x.ticker+'" class="'+(x.ticker===h.ticker?'on':'')+'">'+x.ticker+'</button>').join('')+'</div><div class="card"><div class="row"><div><div class="ticker">'+h.ticker+'</div><div class="name">'+h.name+'</div></div><div class="price">'+usd(sn?.price)+'</div></div><div class="status '+q[1]+'">'+q[0]+'</div><div class="metrics">'+metric('내 수익률',pct(ret(h)))+metric('보유 수량',h.shares+'주')+metric('보유 비중',weight(h).toFixed(1)+'%')+'</div></div><div class="card"><div class="row"><b>가격 추이</b><div class="legend"><span><i class="p"></i>가격</span><span><i class="m20"></i>20일선</span><span><i class="m60"></i>60일선</span></div></div><div class="periods">'+['1M','3M','6M','1Y'].map(x=>'<button data-p="'+x+'" class="'+(period===x?'on':'')+'">'+({'1M':'1개월','3M':'3개월','6M':'6개월','1Y':'1년'})[x]+'</button>').join('')+'</div><div class="ext">'+ext('기간 최고',e?.hi)+ext('기간 최저',e?.lo)+ext(sn?.historyComplete?'전체 최고':'전체 최고*',allH)+ext(sn?.historyComplete?'전체 최저':'전체 최저*',allL)+'</div><div class="chart" id="chart">'+chart(b)+'<div class="tooltip" id="tip"></div></div><div class="foot"><span>* 전체 이력은 별도 호출</span>'+(!sn?.historyComplete&&s.apiKey?'<button class="smallbtn secondary" data-full="1">전체 이력</button>':'')+'</div></div><div class="card">'+['평균매수가|'+usd(h.avgPrice),'평가액|₩'+Math.round(mv(h)).toLocaleString(),'보유비중|'+weight(h).toFixed(1)+'%'].map(x=>{let[a,b]=x.split('|');return'<div class="info"><span>'+a+'</span><b>'+b+'</b></div>'}).join('')+'</div><button class="full secondary" data-edit="'+h.ticker+'">보유정보 수정</button>'}
function fld(l,k,v,t='text'){return'<label class="field"><span>'+l+'</span><input data-s="'+k+'" type="'+t+'" value="'+v+'"></label>'}
function settings(){return'<h2 class="section">내 종목</h2>'+s.holdings.map(h=>'<div class="card holding"><div><b>'+h.ticker+'</b><div class="name">'+h.shares+'주 · 평단 '+usd(h.avgPrice)+'</div></div><button class="smallbtn secondary" data-edit="'+h.ticker+'">수정</button></div>').join('')+'<button class="full" data-add="1">＋ 종목 추가</button><h2 class="section">내 자산</h2><div class="card">'+fld('현금 보유액 (원)','cashKRW',s.cashKRW,'number')+fld('원/달러 환율','fxUSDKRW',s.fxUSDKRW,'number')+'</div><h2 class="section">QLD 규칙</h2><div class="card grid">'+fld('최대 비중 (%)','qldMaxWeight',s.qldMaxWeight,'number')+fld('최소 현금 비중 (%)','minCashRatio',s.minCashRatio,'number')+fld('익절 감시 (%)','qldProfitWatch',s.qldProfitWatch,'number')+s.qldStages.map((x,i)=>fld((i+1)+'단계 하락률 (%)','st'+i,x,'number')).join('')+'</div><h2 class="section">실제 시세 API</h2><div class="card">'+fld('Twelve Data API Key','apiKey',s.apiKey,'password')+'<div class="name">키는 이 기기 브라우저에만 저장됩니다.</div></div>'}
function editHtml(){if(!editor)return'';let h=editor.v,E=!!editor.old;return'<div class="modal"><div class="sheet"><div class="sheethead"><span>'+(E?h.ticker+' 수정':'종목 추가')+'</span><button class="close" data-close="1">×</button></div><div class="grid">'+fld('티커','eTicker',h.ticker)+fld('보유주수','eShares',h.shares,'number')+fld('평균매수가 ($)','eAvg',h.avgPrice,'number')+fld('표시 이름','eName',h.name)+fld('최대 비중 (%)','eMax',h.maxWeight,'number')+fld('익절 감시 (%)','eProfit',h.profitWatch,'number')+'</div><button class="full" data-save="1">저장</button>'+(E?'<button class="full secondary" data-del="1" style="margin-top:8px">삭제</button>':'')+'</div></div>'}
function render(){document.getElementById('app').innerHTML='<div class="app"><header class="top"><div><div class="brand">투자 감시기</div><div class="sub">'+(msg||'v0.4 실제 시세')+'</div></div><button class="refresh" data-refresh="1">↻</button></header><main>'+(page==='home'?home():page==='detail'?detail():settings())+'</main><nav class="nav">'+['home','detail','settings'].map(x=>'<button data-nav="'+x+'" class="'+(page===x?'on':'')+'">'+({home:'⌂ 홈',detail:'⌁ 상세',settings:'⚙ 설정'})[x]+'</button>').join('')+'</nav></div>'+editHtml()+(busy?'<div class="loading"><div>'+msg+'</div></div>':'');bind()}
function bind(){document.querySelector('[data-refresh]')?.addEventListener('click',refresh);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();if(page==='detail'&&sel)ensure(sel)});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{sel=b.dataset.detail;page='detail';render();ensure(sel)});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=b.dataset.t;render();ensure(sel)});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;render()});document.querySelector('[data-full]')?.addEventListener('click',()=>ensure(sel,true));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelector('[data-add]')?.addEventListener('click',()=>openEdit());document.querySelector('[data-close]')?.addEventListener('click',()=>{editor=null;render()});document.querySelector('[data-save]')?.addEventListener('click',saveEdit);document.querySelector('[data-del]')?.addEventListener('click',delEdit);document.querySelectorAll('[data-s]').forEach(x=>x.onchange=change);let c=document.getElementById('chart'),tip=document.getElementById('tip');if(c&&tip&&chartPts.length)c.onpointermove=e=>{let r=c.getBoundingClientRect(),i=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(chartPts.length-1)),p=chartPts[i];tip.style.display='block';tip.style.left=Math.min(r.width-130,Math.max(5,e.clientX-r.left+8))+'px';tip.innerHTML=date(p.date)+'<br>종가 '+usd(p.close)+'<br>20일선 '+usd(p.ma20)+'<br>60일선 '+usd(p.ma60)}}
function openEdit(t){let f=s.holdings.find(h=>h.ticker===t);editor={old:f?.ticker||null,v:f?structuredClone(f):{ticker:'',name:'',type:'stock',shares:0,avgPrice:0,maxWeight:25,profitWatch:40}};render()}
function change(e){let k=e.target.dataset.s,v=e.target.value;if(k.startsWith('e')){let h=editor.v;if(k==='eTicker')h.ticker=v.toUpperCase();if(k==='eShares')h.shares=+v||0;if(k==='eAvg')h.avgPrice=+v||0;if(k==='eName')h.name=v;if(k==='eMax')h.maxWeight=+v||0;if(k==='eProfit')h.profitWatch=+v||0;return}if(k==='apiKey')s.apiKey=v;else if(k.startsWith('st'))s.qldStages[+k.slice(2)]=+v||0;else s[k]=+v||0;save();msg='✓ 저장됨';render()}
function saveEdit(){let h=editor.v;h.ticker=(h.ticker||'').trim().toUpperCase();h.name=h.name||h.ticker;if(!h.ticker)return;let i=s.holdings.findIndex(x=>x.ticker===editor.old);if(i>=0)s.holdings[i]=h;else s.holdings.push(h);sel=h.ticker;editor=null;save();render()}function delEdit(){s.holdings=s.holdings.filter(h=>h.ticker!==editor.old);sel=s.holdings[0]?.ticker||'';editor=null;save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=3',{updateViaCache:'none'}).catch(()=>{});render();
</script></body></html>
