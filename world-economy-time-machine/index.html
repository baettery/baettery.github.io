<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Economy Time Machine · v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf7ff;font:14px system-ui}header{padding:22px 30px;border-bottom:1px solid #254055}h1{margin:5px 0;font-size:27px}small,.muted{color:#9aaec4}main{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.card{background:linear-gradient(135deg,#132539,#091725);border:1px solid #263e54;border-radius:15px;overflow:hidden}.card h3{padding:16px;margin:0;font-size:13px;letter-spacing:.12em}#globe{height:520px}.race{position:relative;height:470px;margin:18px;overflow:hidden}.item{position:absolute;left:0;right:0;height:30px;display:grid;grid-template-columns:30px 115px 1fr 85px;align-items:center;gap:8px;transition:transform .72s cubic-bezier(.2,.8,.2,1),opacity .5s;cursor:pointer}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:16px;background:#1a3344;border-radius:5px}.bar{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#367ad8,#56f0d3);transition:width .7s}.value{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}.controls{margin-top:15px;padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}#year{font-size:42px;font-weight:800;min-width:115px}input{flex:1;min-width:170px;accent-color:#66e4d2}button,select{border:1px solid #39566a;border-radius:8px;padding:11px;background:#193144;color:white;cursor:pointer}button:hover{background:#2a5266}#status{font-size:12px;color:#aac9d6;padding:0 22px 18px}footer{padding:18px 30px;color:#9bb4c3;font-size:12px}a{color:#76e3d6}@media(max-width:950px){.grid{grid-template-columns:1fr}#globe{height:390px}.item{grid-template-columns:24px 90px 1fr 70px;font-size:11px}}
</style><header><small>DATA STORYTELLING / INTERACTIVE WEB</small><h1>🌐 World Economy Time Machine</h1><small>Animated 3D GDP columns × Ranking Race · v2.0</small></header><main><div class="grid"><section class="card"><h3>01 · GLOBAL ECONOMY GLOBE</h3><div id="globe"></div></section><section class="card"><h3>02 · GDP RANKING RACE · TOP 12</h3><div class="race" id="race"></div></section></div><section class="card controls"><strong id="year">2000</strong><input id="slider" type="range" min="1960" max="2024" value="2000" disabled aria-label="연도"><button id="play" disabled>▶ 재생</button><button id="reset" disabled>↺ 처음</button><label>속도 <select id="speed"><option value="1100">보통</option><option value="700">빠름</option><option value="1700">느림</option></select></label></section><p id="status">World Bank 데이터를 연결하고 있습니다…</p></main><footer>Source: <a href="https://data.worldbank.org/indicator/NY.GDP.MKTP.CD">World Bank WDI · GDP (current US$)</a> · 대표 좌표에 기둥 표시 · 물가/환율 미조정 · 데이터 없는 국가는 제외 · v2.0</footer><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/globe.gl@2.37.0/dist/globe.gl.min.js"></script><script>
const $=x=>document.getElementById(x),base='https://api.worldbank.org/v2',centers={USA:[38,-98],CHN:[35,104],JPN:[36,138],DEU:[51,10],IND:[22,79],GBR:[54,-2],FRA:[47,2],ITA:[42,12],CAN:[56,-106],BRA:[-12,-52],RUS:[61,96],KOR:[36,128],AUS:[-25,134],ESP:[40,-4],MEX:[24,-102],IDN:[-3,118],TUR:[39,35],NLD:[52,5],CHE:[47,8],SAU:[24,45],POL:[52,19],SWE:[63,16],ARG:[-35,-64],NOR:[61,9],ZAF:[-30,24],NGA:[9,8],EGY:[27,30],PAK:[30,70],BGD:[24,90],THA:[15,101],VNM:[16,106],SGP:[1,104],ARE:[24,54],IRN:[32,54],ISR:[31,35],IRL:[53,-8],AUT:[48,14],BEL:[51,4],DNK:[56,10],FIN:[64,26],PRT:[40,-8],GRC:[39,23],NZL:[-41,174],CHL:[-33,-71],COL:[4,-74],PER:[-10,-76],PHL:[13,122],MYS:[4,102],UKR:[49,32],CZE:[50,15],ROU:[46,25],HUN:[47,20],KAZ:[48,67],QAT:[25,51],KWT:[29,48]};
let series=new Map(),names=new Map(),years=[],yr=2000,timer=null,globe=null,nodes=new Map();
const money=x=>x>=1e12?'$'+(x/1e12).toFixed(2)+'T':x>=1e9?'$'+(x/1e9).toFixed(1)+'B':'$'+(x/1e6).toFixed(0)+'M';
async function get(u){const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j[1]))throw Error('API 응답 오류');return j[1]}
function render(){let rows=[...(series.get(yr)||new Map())].map(([id,v])=>({id,v,name:names.get(id)||id})).sort((a,b)=>b.v-a.v),top=rows.slice(0,12),max=top[0]?.v||1,present=new Set();$('year').textContent=yr;$('slider').value=yr;for(let i=0;i<top.length;i++){let o=top[i];present.add(o.id);let n=nodes.get(o.id);if(!n){n=document.createElement('div');n.className='item';n.style.opacity='0';n.style.transform='translateY(460px)';n.innerHTML='<span class="num"></span><span class="name"></span><div class="track"><div class="bar"></div></div><span class="value"></span>';$('race').append(n);nodes.set(o.id,n)}n.querySelector('.num').textContent=String(i+1).padStart(2,'0');n.querySelector('.name').textContent=o.name;n.querySelector('.value').textContent=money(o.v);n.onclick=()=>{if(globe&&centers[o.id])globe.pointOfView({lat:centers[o.id][0],lng:centers[o.id][1],altitude:1.6},900)};requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.opacity='1';n.style.transform='translateY('+(i*38)+'px)';n.querySelector('.bar').style.width=(o.v/max*100)+'%'}))}for(const [id,n] of nodes){if(!present.has(id)){nodes.delete(id);n.style.opacity='0';n.style.transform='translateY(460px)';setTimeout(()=>n.remove(),740)}}if(globe){const winners=new Set(rows.slice(0,10).map(r=>r.id));globe.pointsData(rows.filter(o=>centers[o.id]).map(o=>({...o,lat:centers[o.id][0],lng:centers[o.id][1],h:Math.max(.007,Math.pow(o.v/max,.58)*.48),winner:winners.has(o.id)}))).pointAltitude(o=>o.h).pointRadius(o=>o.winner?.4:.22).pointColor(o=>o.winner?'#43e8c9':'#7796ff').pointLabel(o=>o.name+' · '+yr+' · '+money(o.v))}$('status').textContent=yr+'년 · '+rows.length+'개 국가 GDP · 3D 기둥 / 순위 동시 애니메이션'}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 재생'}
function play(){if(timer){stop();return}if(yr===years.at(-1))yr=years[0];$('play').textContent='Ⅱ 일시정지';timer=setInterval(()=>{let i=years.indexOf(yr);if(i>=years.length-1){stop();return}yr=years[i+1];render()},Number($('speed').value))}
$('play').onclick=play;$('reset').onclick=()=>{stop();yr=years[0];render()};$('slider').oninput=e=>{stop();yr=+e.target.value;render()};$('speed').onchange=()=>{if(timer){stop();play()}};
(async()=>{try{if(window.Globe){globe=Globe()($('globe')).backgroundColor('rgba(0,0,0,0)').globeImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg').showAtmosphere(true).atmosphereColor('#60bdda').pointsMerge(false).pointTransitionDuration(700);globe.pointOfView({lat:25,lng:20,altitude:2.25});globe.controls().autoRotate=true;globe.controls().autoRotateSpeed=.4;const resize=()=>globe.width($('globe').clientWidth).height($('globe').clientHeight);resize();addEventListener('resize',resize)}const [countries,gdp]=await Promise.all([get(base+'/country?format=json&per_page=400'),get(base+'/country/all/indicator/NY.GDP.MKTP.CD?format=json&date=1960:2025&per_page=25000')]);const valid=new Set(countries.filter(x=>x.region?.value!=='Aggregates').map(x=>x.id));for(const c of countries)if(valid.has(c.id))names.set(c.id,c.name);for(const r of gdp){let id=r.countryiso3code,y=+r.date,v=r.value;if(!valid.has(id)||!Number.isFinite(v)||v<=0)continue;if(!series.has(y))series.set(y,new Map());series.get(y).set(id,v)}years=[...series.keys()].sort((a,b)=>a-b);if(!years.length)throw Error('사용 가능한 GDP 데이터가 없습니다');$('slider').min=years[0];$('slider').max=years.at(-1);yr=years.includes(2000)?2000:years.at(-1);$('slider').disabled=false;$('play').disabled=false;$('reset').disabled=false;render()}catch(e){$('status').textContent='데이터 연결 실패: '+e.message+' · 새로고침하거나 API 연결을 확인해 주세요.';console.error(e)}})();
</script></html>
